version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: company_finance_postgres
    restart: always
    environment:
      POSTGRES_DB: company_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
